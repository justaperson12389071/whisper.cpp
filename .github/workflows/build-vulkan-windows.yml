name: Build whisper.cpp Vulkan Windows

on:
  workflow_dispatch:

jobs:
  build-vulkan:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        id: cache-vulkan
        with:
          path: C:\VulkanSDK\1.3.290.0
          key: vulkan-sdk-1.3.290.0-windows

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe"
          $out = "$env:TEMP\vulkan-installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait

      - name: Setup Vulkan Environment
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\1.3.290.0\Bin" >> $env:GITHUB_PATH

      - name: Configure & Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target whisper-cli -j

      - name: Collect DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item build\bin\Release\whisper-cli.exe artifact\
          Copy-Item build\bin\Release\ggml.dll artifact\
          Copy-Item build\bin\Release\ggml-base.dll artifact\
          Copy-Item build\bin\Release\ggml-cpu.dll artifact\
          Copy-Item build\bin\Release\ggml-vulkan.dll artifact\
          Copy-Item build\bin\Release\whisper.dll artifact\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-windows-x64
          path: artifact/*
