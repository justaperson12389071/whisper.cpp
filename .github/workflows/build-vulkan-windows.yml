name: Build whisper.cpp Vulkan Windows (MSYS2)

on:
  workflow_dispatch:

jobs:
  build-vulkan-msys2:
    runs-on: windows-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-shaderc

      - name: Build with Vulkan
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)

      - name: Collect artifacts
        shell: msys2 {0}
        run: |
          mkdir artifact
          cp build/bin/whisper-cli.exe artifact/
          cp build/bin/*.dll artifact/ 2>/dev/null || true
          # Копируем системные DLL из MSYS2, нужные для запуска без MSYS2
          for dll in vulkan-1.dll libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll libgomp-1.dll; do
            cp /ucrt64/bin/$dll artifact/ 2>/dev/null || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-msys2-x64
          path: artifact/*
