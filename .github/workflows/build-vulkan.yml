name: Build whisper.cpp with Vulkan

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в GitHub
  push:
    branches: [ master, main ]

jobs:
  # ==========================================
  # Сборка под Windows (x64)
  # ==========================================
  build-windows:
    name: Windows x64 (Vulkan)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan-sdk-version: 1.3.296.0

      - name: Configure CMake
        run: |
          cmake -B build -DGGML_VULKAN=1 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release -j

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          # Копируем скомпилированные .exe и .dll
          cp build/bin/Release/*.exe output/ || cp build/bin/*.exe output/ || true
          cp build/bin/Release/*.dll output/ || cp build/bin/*.dll output/ || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows-vulkan-x64
          path: output/*

  # ==========================================
  # Сборка под Linux (Ubuntu x64)
  # ==========================================
  build-linux:
    name: Linux x64 (Vulkan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libvulkan-dev glslc spirv-headers

      - name: Configure CMake
        run: |
          cmake -B build -DGGML_VULKAN=1 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release -j $(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          find build/bin/ -maxdepth 1 -type f -executable -exec cp {} output/ \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-vulkan-x64
          path: output/*
